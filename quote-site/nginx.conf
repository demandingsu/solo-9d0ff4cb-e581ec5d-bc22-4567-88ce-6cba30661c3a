server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 静态报价站：目录式 URL 与 .html 均可访问
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # 演示用 404 页面（如 plans/p007.html 故意缺失）
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
